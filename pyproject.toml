[project]
name = "linebreak-twist"
version = "0.1.0"
description = "Linebreaking mechanisms (QK twist heads) in open-weight language models"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.56,<5",
    "accelerate>=1.0",
    "datasets>=3.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
